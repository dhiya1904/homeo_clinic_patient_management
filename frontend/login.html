<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    if (localStorage.getItem("token")) {
      window.location.href = "index.html";
    }
  </script>
  <meta name="description" content="Secure Login - Jireh Homeopathy" />
  <title>Login | Jireh Homeopathy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      margin: 0;
      padding: 40px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      margin: auto;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-card {
      background: var(--surface);
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: var(--radius-lg);
      padding: 48px;
      box-shadow: 0 12px 24px rgba(17, 24, 39, 0.04), 0 2px 8px rgba(17, 24, 39, 0.02);
      position: relative;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: var(--accent-subtle);
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 24px;
      margin: 0 auto 24px;
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.8px;
    }

    .login-header p {
      color: var(--muted);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i:first-child {
      position: absolute;
      left: 16px;
      z-index: 10;
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 40px 12px 40px;
      color: var(--text);
      font-size: 14px;
      transition: all var(--transition);
      font-family: inherit;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-subtle);
      outline: none;
    }

    .pass-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      transition: color var(--transition);
      font-size: 15px;
    }

    .pass-toggle:hover {
      color: var(--text);
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-2);
      cursor: pointer;
      font-weight: 500;
    }

    .remember-me input {
      accent-color: var(--accent);
    }

    .forgot-pass {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .btn-login:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-login:active {
      transform: translateY(1px);
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    
    .login-footer a:hover {
      text-decoration: underline;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body data-theme="light">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fa-solid fa-house-medical"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Login to manage your clinic</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Clinic ID or Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="text" id="email" placeholder="admin@homeocare.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••" required />
            <i class="fa-solid fa-eye pass-toggle" id="togglePass"></i>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" />
            Remember me
          </label>
          <a href="#" class="forgot-pass">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="#">Contact Support</a><br><br>
        <div style="padding-top: 10px; border-top: 1px solid var(--border)">
          <span style="font-size: 13px">New Patient?</span> <a href="register.html">Register Here</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script>
    // Centralized API configuration: defaults to localhost for development, and points to the live Render web service in production.
    const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "http://localhost:5000/api"
      : "https://homeo-clinic-patient-management.onrender.com/api";

    // ── Toast ──────────────────────────────────────────────────
    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast show ${type}`;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = "toast"; }, 3500);
    }

    // ── Eye toggle ─────────────────────────────────────────────
    document.getElementById("togglePass").addEventListener("click", function () {
      const passInput = document.getElementById("password");
      const isPass = passInput.type === "password";
      passInput.type = isPass ? "text" : "password";
      this.classList.toggle("fa-eye");
      this.classList.toggle("fa-eye-slash");
    });

    // ── Login form submit ──────────────────────────────────────
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");

      if (!username || !password) {
        showToast("Please enter your ID and password.", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("clinicName", data.clinic_name || "Jireh Homeopathy");
          showToast("Login successful! Redirecting...");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        } else {
          showToast(data.error || "Login failed. Check your credentials.", "error");
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        console.error("Login error:", err);
        showToast("Cannot reach server. Is the backend running on port 5000?", "error");
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
