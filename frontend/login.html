<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure Login - Jireh Homeopathy" />
  <title>Login | Jireh Homeopathy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: radial-gradient(circle at top right, rgba(96, 165, 250, 0.1), transparent),
                  radial-gradient(circle at bottom left, rgba(45, 212, 191, 0.1), transparent),
                  var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
      animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--teal));
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 32px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 16px rgba(96, 165, 250, 0.3);
    }

    .login-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--muted);
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i:first-child {
      position: absolute;
      left: 16px;
      z-index: 10;
      color: var(--muted);
      font-size: 18px;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 60px 14px 48px; /* 60px on right for eye icon */
      color: var(--text);
      font-size: 15px;
      transition: all 0.3s;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.15);
      outline: none;
    }

    .pass-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      color: var(--muted);
      cursor: pointer;
      padding: 5px;
      transition: color 0.3s;
    }

    .pass-toggle:hover {
      color: var(--text);
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--accent);
    }

    .forgot-pass {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--teal));
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(96, 165, 250, 0.3);
      filter: brightness(1.1);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 14px;
      color: var(--muted);
    }

    .login-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating blobs for background */
    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: var(--accent);
      filter: blur(120px);
      opacity: 0.15;
      z-index: -1;
      border-radius: 50%;
      animation: move 20s infinite alternate;
    }

    .blob-1 { top: -100px; left: -100px; }
    .blob-2 { bottom: -100px; right: -100px; background: var(--teal); animation-delay: -5s; }

    @keyframes move {
      from { transform: translate(0, 0); }
      to { transform: translate(100px, 100px); }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fa-solid fa-house-medical"></i>
        </div>
        <h1>Welcome Back</h1>
        <p>Login to manage your clinic</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Clinic ID or Email</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="text" id="email" placeholder="admin@homeocare.com" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••" required />
            <i class="fa-solid fa-eye pass-toggle" id="togglePass"></i>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" />
            Remember me
          </label>
          <a href="#" class="forgot-pass">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer">
        Don't have an account? <a href="#">Contact Support</a><br><br>
        <div style="padding-top: 10px; border-top: 1px solid var(--border)">
          <span style="font-size: 13px">New Patient?</span> <a href="register.html">Register Here</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script>
    const API_URL = "/api";

    // ── Toast ──────────────────────────────────────────────────
    function showToast(msg, type = "success") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = `toast show ${type}`;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = "toast"; }, 3500);
    }

    // ── Eye toggle ─────────────────────────────────────────────
    document.getElementById("togglePass").addEventListener("click", function () {
      const passInput = document.getElementById("password");
      const isPass = passInput.type === "password";
      passInput.type = isPass ? "text" : "password";
      this.classList.toggle("fa-eye");
      this.classList.toggle("fa-eye-slash");
    });

    // ── Login form submit ──────────────────────────────────────
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const username = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");

      if (!username || !password) {
        showToast("Please enter your ID and password.", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("clinicName", data.clinic_name || "Jireh Homeopathy");
          showToast("Login successful! Redirecting...");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        } else {
          showToast(data.error || "Login failed. Check your credentials.", "error");
          btn.disabled = false;
          btn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        console.error("Login error:", err);
        showToast("Cannot reach server. Is the backend running on port 5000?", "error");
        btn.disabled = false;
        btn.innerHTML = '<span>Sign In to Dashboard</span><i class="fa-solid fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
